name: Deploy Verify

# Deployment verification + uptime canary. Runs the post-deploy smoke test
# (scripts/smoke-test.mjs) against the live site: status 200, app shell, the
# production security headers, the SPA deep-link fallback, and — on push —
# the RELEASE IDENTITY of the deployed bundle (chessmate@<version>+<commit>).
# Turns red if a deploy ships broken, a config change drops the headers, or
# production keeps serving a stale build after a push to main.
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to smoke test (defaults to PROD_URL repo variable / production)'
        required: false
  schedule:
    - cron: '0 * * * *' # hourly uptime canary
  push:
    branches: [main] # post-deploy verification

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      # On push to main the smoke test verifies the deployed bundle embeds this
      # exact commit (chessmate@<version>+<sha>, injected by vite.config.ts) and
      # polls up to ~10 minutes so it waits out the Netlify build instead of
      # racing it — this replaces the old fixed `sleep 120`. Scheduled/dispatch
      # runs pass no EXPECTED_COMMIT: they assert a release tag exists and print
      # it, so drift stays visible in the canary log.
      - name: Smoke test the live site
        env:
          SMOKE_URL: ${{ github.event.inputs.url || vars.PROD_URL || 'https://chess-mateapp.netlify.app' }}
          EXPECTED_COMMIT: ${{ github.event_name == 'push' && github.sha || '' }}
        run: node scripts/smoke-test.mjs "$SMOKE_URL"
